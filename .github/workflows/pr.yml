# Validate: no green, no merge. The flywheel's own home runs the flywheel's own
# gate — a meta repo exempt from its own rules is a rule nobody believes.
name: pr

on:
  pull_request:

jobs:
  # No bead, no build — checked rather than remembered. Advisory for now
  # (ADR 0001: a gate goes blocking only once its noise level is known).
  intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: BASE_REF=origin/${{ github.base_ref }} tools/flywheel/bead-lint.sh
      # Decisions that got re-derived without being recorded. Advisory, and
      # exits 0 whatever it finds — its flags are ::warning:: annotations next
      # to the diff, never a failed check (ADR 0001).
      - run: go run ./tools/fleet adr-drift -base origin/${{ github.base_ref }}

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      # git exports GIT_DIR and GIT_INDEX_FILE to its hooks, so a test that
      # shells out to git without a hermetic env acts on the real repository
      # and exits 128. That fails only under the pre-commit gate and passes by
      # hand, so it lands green and then blocks every commit (fw-c1l). Running
      # the suite with the pointers set reproduces the hook here, where it is
      # visible, instead of on someone's next commit.
      - run: GIT_DIR=/nonexistent GIT_INDEX_FILE=/nonexistent/index go test ./...

  conformance:
    # The protocol's failure behaviour: two agents on one bead, killed agents,
    # stale leases, the kill switch. Needs the real bd binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install bd
        # Prebuilt binary, not `go install`: bd vendors Dolt, so building it
        # from source takes minutes on every run. Pinned rather than @latest —
        # the conformance suite asserts bd's behaviour, so an unannounced bd
        # release should fail loudly here, not silently change what we test.
        run: |
          ver=1.2.2
          curl -fsSL "https://github.com/steveyegge/beads/releases/download/v${ver}/beads_${ver}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin bd
          bd version
      - run: go test -tags=conformance -timeout=10m ./tools/fleet/
