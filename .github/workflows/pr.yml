# Validate: no green, no merge. The flywheel's own home runs the flywheel's own
# gate — a meta repo exempt from its own rules is a rule nobody believes.
name: pr

on:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  conformance:
    # The protocol's failure behaviour: two agents on one bead, killed agents,
    # stale leases, the kill switch. Needs the real bd binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install bd
        # Prebuilt binary, not `go install`: bd vendors Dolt, so building it
        # from source takes minutes on every run. Pinned rather than @latest —
        # the conformance suite asserts bd's behaviour, so an unannounced bd
        # release should fail loudly here, not silently change what we test.
        run: |
          ver=1.2.2
          curl -fsSL "https://github.com/steveyegge/beads/releases/download/v${ver}/beads_${ver}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin bd
          bd version
      - run: go test -tags=conformance -timeout=10m ./tools/fleet/
