# Learn: weekly DORA + agent-effectiveness snapshot committed back to the repo.
# The git history of docs/dora.json IS the trend line; docs/fleet.html joins
# every repo's snapshot into one page.
#
# `fleet doctor` found this workflow missing from the flywheel's own home — the
# repo that defines the Learn stage was not running it on itself.
name: learn

on:
  schedule:
    - cron: "0 6 * * 1" # monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # One canonical collector, invoked cross-repo (ADR 0005). No copy to drift.
      - run: go run github.com/jamesponwith/flywheel-template/tools/dora@latest -repo "$GITHUB_REPOSITORY" -out docs/dora.json -prs 50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/dora.json
          if ! git diff --cached --quiet; then
            git commit -m "learn: weekly snapshot"
            git push
          fi
