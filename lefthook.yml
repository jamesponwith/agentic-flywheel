# Build inner-loop gate. Under 10s or it gets skipped — speed is a feature.
# The conformance suite is NOT here: it spins up real bd databases and takes
# ~75s. It runs in CI (pr.yml) and on demand.
pre-commit:
  parallel: true
  commands:
    # beads follows core.hooksPath and installs ITS hooks wherever it points.
    # A chain directory was clobbered that way and the pre-commit hook vanished
    # entirely, hours after being "fixed". So lefthook owns .git/hooks and beads
    # is invoked as a declared step instead: one owner, one path (ADR 0012).
    beads:
      run: |
        h="$(git rev-parse --show-toplevel)/.beads/hooks/pre-commit"
        [ -x "$h" ] && "$h" || true
    # A commit mid-rebase may not build even when neither endpoint is broken.
    # Skipping is recorded rather than silent, because an unmeasured bypass is
    # a rule that is not in force. CI remains the real gate.
    replay-guard:
      run: |
        for f in rebase-merge rebase-apply MERGE_HEAD CHERRY_PICK_HEAD; do
          if [ -e "$(git rev-parse --git-path $f)" ]; then
            echo "pre-commit: replay in progress ($f) — CI is the gate here"
            tools/flywheel/guard.sh log gate.skipped reason="$f" 2>/dev/null || true
          fi
        done
    # A test helper that shelled out to git without a hermetic env rewrote this
    # repository's own user.email to the fixture value "d@d" — GitHub resolves
    # that address to an unrelated account, so 27 commits were published under
    # a stranger's name before anyone noticed. Squash-merge happened to
    # sanitise main, which is luck, not a control.
    #
    # A fixture address has no dot in its domain. Real ones do.
    identity:
      run: |
        email=$(git config user.email 2>/dev/null || true)
        case "${email#*@}" in
        *.*) ;;
        *) echo "pre-commit: refusing to commit as '${email:-<unset>}' — that is a test"
           echo "  fixture identity, not yours. A non-hermetic test helper writes it into"
           echo "  .git/config. Fix with: git config --local --unset user.email"
           exit 1 ;;
        esac
    gofmt:
      run: test -z "$(gofmt -l .)" || { echo "unformatted:"; gofmt -l .; exit 1; }
    vet:
      run: go vet ./...
    # The conformance suite is not RUN here (it needs real bd databases and
    # ~75s), but it must still COMPILE here. Twice now a change to a shared
    # signature left drill_test.go broken and nothing local noticed, because
    # `go test ./...` does not build what sits behind a build tag — the same
    # shape as a gate that fails only under the hook. Vet is 0.2s; running it
    # is cheaper than learning this from CI again.
    vet-conformance:
      run: go vet -tags=conformance ./...
    test:
      run: go test -short ./...
    shellsyntax:
      glob: "*.sh"
      # bash -n, not sh -n: these scripts declare bash and use [[ ]] and
      # BASH_REMATCH. sh -n false-fails on them, and a gate that fails on
      # correct code is one that gets bypassed.
      run: bash -n {staged_files}

# pre-push deliberately has no AI review (ADR 0013). An eight-minute agent task
# attached to a synchronous git operation got bypassed six times in one
# afternoon by the person who wrote the rule. Review now runs inside
# /flywheel-next, where the cost lands on an agent session rather than on
# someone waiting at a terminal. `/flywheel-review` remains available on demand.

# The only pre-push rule: refuse what ADR 0003 forbids an unattended agent.
# It costs milliseconds and is scoped to agents, so it does not become the
# eight-minute hook above that got bypassed six times in an afternoon.
# The only pre-push rule: refuse what ADR 0003 forbids an unattended agent.
# It costs milliseconds and is scoped to agents, so it does not become the
# eight-minute hook above that got bypassed six times in an afternoon.
#
# A script, not a command. lefthook filters `commands` by the files being
# pushed and skips those with none — sensible for a linter, wrong for a rule
# that must judge the REFS whatever the diff contains. As a command it printed
# "(skip) no matching push files" and let a builder push straight to main.
# `skip_empty: false` does not fix it: lefthook 1.13.6 drops the key silently,
# which `lefthook dump` will show you and the run will not.
pre-push:
  scripts:
    "push-guard.sh":
      # git passes the refs on stdin; without this the read loop sees none and
      # the guard exits 0 on everything.
      use_stdin: true
      runner: bash
