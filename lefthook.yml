# Build inner-loop gate. Under 10s or it gets skipped — speed is a feature.
# The conformance suite is NOT here: it spins up real bd databases and takes
# ~75s. It runs in CI (pr.yml) and on demand.
pre-commit:
  parallel: true
  commands:
    gofmt:
      run: test -z "$(gofmt -l .)" || { echo "unformatted:"; gofmt -l .; exit 1; }
    vet:
      run: go vet ./...
    test:
      run: go test -short ./...
    shellsyntax:
      glob: "*.sh"
      # bash -n, not sh -n: these scripts declare bash and use [[ ]] and
      # BASH_REMATCH. sh -n false-fails on them, and a gate that fails on
      # correct code is one that gets bypassed.
      run: bash -n {staged_files}

pre-push:
  commands:
    ai-review:
      # Three lenses, findings recorded in .flywheel/review.jsonl (ADR 0002).
      #
      # `</dev/null` is load-bearing: git hands a pre-push hook the ref list on
      # stdin, which the agent CLI then reads instead of its prompt and dies
      # with "Input must be provided". That failure was swallowed by `|| true`
      # for the panel's entire life, so the review never once ran and the empty
      # ledger was the only tell.
      #
      # Still advisory, but no longer silent: a reviewer that could not RUN is
      # reported, distinctly from a reviewer that ran and found nothing. A hook
      # that cannot fail cannot be trusted.
      run: |
        command -v "${FLYWHEEL_AGENT_CMD:-claude}" >/dev/null || exit 0
        count() { [ -f .flywheel/review.jsonl ] && wc -l < .flywheel/review.jsonl || echo 0; }
        before=$(count)
        if ! "${FLYWHEEL_AGENT_CMD:-claude}" -p "/flywheel-review origin/main...HEAD" </dev/null; then
          echo "warning: review did not run (agent invocation failed) — this is not 'no findings'" >&2
          exit 0
        fi
        after=$(count)
        [ "$after" -gt "$before" ] && echo "review: $((after - before)) finding(s) recorded" || echo "review: ran, no findings"
